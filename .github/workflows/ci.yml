
name: ShopFlow Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Run automated tests
        working-directory: backend
        run: npm test

      - name: Validate JavaScript syntax
        working-directory: backend
        run: |
          find src -type f -name '*.js' ! -path 'src/worker/*' -exec node --check {} \;

      - name: Build Docker image
        run: docker build --pull -t shopflow-backend:ci -f backend/Dockerfile backend
