
name: ShopFlow Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 3. Install dependencies
      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # 4. Run automated tests
      - name: Run automated tests
        working-directory: backend
        run: npm test

      # 5. Validate JavaScript syntax
      - name: Validate JavaScript syntax
        working-directory: backend
        run: |
          find src -type f -name '*.js' ! -path 'src/worker/*' -exec node --check {} \;

      # 6. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 7. Authenticate with Docker Hub (only on main push)
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Build and publish Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shopflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/shopflow-backend:${{ github.sha }}
